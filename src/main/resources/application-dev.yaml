server:
  port: 4379

spring:
  output:
    ansi:
      enabled: always
  mongodb:
    uri: mongodb://root:123456@localhost:27017/mongo_playground?authSource=admin
  data:
    redis:
      host: localhost
      port: 6379
      username: ""
      password: ""
      database: 0
      timeout: 3s
      connect-timeout: 3s
      ssl:
        enabled: false
  datasource:
    business:
      url: jdbc:postgresql://localhost:5432/postgres
      username: root
      password: 123456
      driver-class-name: org.postgresql.Driver
    playground:
      url: jdbc:postgresql://localhost:5432/demo?options=-c%20TimeZone%3DAsia%2FShanghai
      username: root
      password: 123456
      driver-class-name: org.postgresql.Driver

application:
  cors:
    enabled: true
    allowed-origins:
      - http://localhost:5173

rocketmq:
  producer:
    endpoints: localhost:18081
    access-key: ""
    secret-key: ""
    namespace: ""
    ssl-enabled: false

playground:
  order-mq:
    order-timeout-millis: 100000

xxl:
  job:
    admin:
      addresses: http://127.0.0.1:18083
      access-token: xxl-job-learning-token
    executor:
      address: http://host.docker.internal:19999
      port: 19999
      log-path: /tmp/xxl-job/jobhandler
