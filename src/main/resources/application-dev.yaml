server:
  port: 4379

spring:
  application:
    name: xiaoxingxing
  mongodb:
    # Spring Boot 4 使用 spring.mongodb.uri 配置连接。
    # 可以通过 MONGODB_URI 覆盖本地学习环境的默认账号和地址。
    uri: ${MONGODB_URI:mongodb://root:123456@localhost:27017/mongo_playground?authSource=admin}
  data:
    mongodb:
      # 学习案例通过 @Indexed / @CompoundIndex 声明索引，启动时自动创建。
      # 生产环境通常应改成受版本控制的显式索引迁移。
      auto-index-creation: true
      representation:
        # NUMBER 题允许使用 BigDecimal，MongoDB 中按 Decimal128 保存，避免退化成字符串。
        big-decimal: decimal128
  redis:
    host: localhost
    port: 6379
  datasource:
    business:
      url: jdbc:postgresql://localhost:5432/postgres
      username: root
      password: 123456
      driver-class-name: org.postgresql.Driver
    playground:
      url: jdbc:postgresql://localhost:5432/demo
      username: root
      password: 123456
      driver-class-name: org.postgresql.Driver

mybatis-plus:
  configuration:
    # 交给 SLF4J/Logback 管理 SQL 日志，避免 StdOutImpl 绕过日志级别持续刷屏。
    # 需要排查 SQL 时，可按 Mapper 包名临时将 logging.level 调整为 DEBUG。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    web: INFO

# RocketMQ 5.x gRPC 客户端连接 Proxy，而不是直接连接 NameServer。
# 本地 Compose 把 Proxy 的容器端口 8081 映射到宿主机 18081。
rocketmq:
  producer:
    endpoints: ${ROCKETMQ_ENDPOINTS:localhost:18081}
    topic: pg_learning_normal,pg_learning_fifo,pg_learning_delay,pg_learning_transaction
    request-timeout: ${ROCKETMQ_REQUEST_TIMEOUT_SECONDS:5}
    max-attempts: ${ROCKETMQ_SEND_MAX_ATTEMPTS:3}
    ssl-enabled: false

playground:
  rocketmq:
    endpoints: ${ROCKETMQ_ENDPOINTS:localhost:18081}
    order-timeout-millis: ${ROCKETMQ_ORDER_TIMEOUT_MILLIS:1800000}
    transaction-prepared-timeout-seconds: ${ROCKETMQ_TRANSACTION_PREPARED_TIMEOUT_SECONDS:120}
    transaction-cleanup-batch-size: ${ROCKETMQ_TRANSACTION_CLEANUP_BATCH_SIZE:50}
    outbox:
      batch-size: ${ROCKETMQ_OUTBOX_BATCH_SIZE:20}
      fixed-delay-millis: ${ROCKETMQ_OUTBOX_FIXED_DELAY_MILLIS:3000}
      lock-timeout-seconds: ${ROCKETMQ_OUTBOX_LOCK_TIMEOUT_SECONDS:60}
      max-publish-retries: ${ROCKETMQ_OUTBOX_MAX_RETRIES:10}
