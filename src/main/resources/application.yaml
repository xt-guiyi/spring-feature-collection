server:
  port: 3379

spring:
  application:
    name: xiaoxingxing

  output:
    ansi:
      # %clr 负责定义哪些片段着色；该开关决定控制台是否真正输出 ANSI 颜色码。
      enabled: always

  mongodb:
    # Spring Boot 4 使用 spring.mongodb.uri；学习环境在 YAML 中直接固定账号、地址和业务库。
    uri: mongodb://root:123456@localhost:27017/mongo_playground?authSource=admin
  data:
    mongodb:
      # 学习案例通过 @Indexed / @CompoundIndex 声明索引，启动时自动创建。
      auto-index-creation: true
      representation:
        # NUMBER 题中的 BigDecimal 按 Decimal128 保存，避免退化为字符串。
        big-decimal: decimal128
    redis:
      # Spring Boot 4 的 Redis 前缀是 spring.data.redis；Spring Data Redis 与 Redisson 共用这一套值。
      host: localhost
      port: 6379
      username: ""
      password: ""
      database: 0
      timeout: 3s
      connect-timeout: 3s
      ssl:
        enabled: false

  datasource:
    business:
      url: jdbc:postgresql://localhost:5432/postgres
      username: root
      password: 123456
      driver-class-name: org.postgresql.Driver
    playground:
      # 固定上海会话时区，确保 orders.created_at 与 XXL-JOB 的上海业务日使用同一时间基准。
      url: jdbc:postgresql://localhost:5432/demo?options=-c%20TimeZone%3DAsia%2FShanghai
      username: root
      password: 123456
      driver-class-name: org.postgresql.Driver

  jackson:
    datatype:
      datetime:
        # Spring Boot 4 / Jackson 3 已把日期开关从 SerializationFeature 移到 DateTimeFeature。
        # 项目业务代码统一注入 Boot 自动配置的 JsonMapper，不再额外声明 Jackson 2 ObjectMapper。
        write-dates-as-timestamps: false

  task:
    scheduling:
      # Outbox 与事务清理是两个独立任务，显式线程数避免依赖 Spring 的隐式默认值。
      pool:
        size: 2
      thread-name-prefix: playground-scheduling-

logging:
  level:
    root: INFO
    web: INFO
  # logback-spring.xml 只负责装配 Appender，具体输出格式从这里读取。
  pattern:
    # 级别颜色由 Spring Boot 根据 INFO/WARN/ERROR 自动选择，时间和结构字符弱化，Logger 使用青色。
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(---){faint} %clr([%15.15thread]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %msg%n"

application:
  cors:
    # 默认环境固定关闭跨域；需要开放时直接修改本配置并指定可信来源。
    enabled: false
    path-pattern: "/**"
    allowed-origins:
      - http://localhost:5173
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
  open-api:
    title: API 文档
    version: 1.0.0
    description: 项目接口文档
    group: playground
    display-name: playground

# RocketMQ 5.x SDK 的 endpoints 指向 Proxy 的 gRPC 端口，不是 NameServer 9876。
rocketmq:
  producer:
    endpoints: localhost:18081
    # Starter 用该列表预取路由；Topic 类型仍必须在 Broker 中预先创建。
    topic: "pg_order_events,pg_order_timeouts,pg_order_transactions"
    request-timeout: 5
    max-attempts: 3
    ssl-enabled: false
    namespace: ""
    access-key: ""
    secret-key: ""

playground:
  mybatis:
    # Playground 使用手工 SqlSessionFactory，因此这些值由专用属性类显式应用。
    mapper-locations:
      - "classpath*:mapper/**/*.xml"
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    pagination-db-type: POSTGRE_SQL

  redis:
    lock:
      wait-time: 3s
      lease-time: 10s
      simulated-work-duration: 1s

  rocketmq:
    enabled: true
    endpoints: localhost:18081

    # 名称由应用配置统一提供；若改名，还必须同步 Docker 中的 Broker 初始化命令。
    topics:
      normal: pg_order_events
      delay: pg_order_timeouts
      transaction: pg_order_transactions
    tags:
      order-created: ORDER_CREATED
      order-paid: ORDER_PAID
      order-cancelled: ORDER_CANCELLED
      outbox-timeout: OUTBOX_PAYMENT_TIMEOUT_CHECK
      transaction-timeout: TRANSACTION_PAYMENT_TIMEOUT_CHECK
    consumer-groups:
      outbox-order-cache: pg_outbox_order_cache_group_v1
      outbox-order-statistics: pg_outbox_order_statistics_group_v1
      outbox-order-timeout: pg_outbox_order_timeout_group_v1
      transaction-order-cache: pg_transaction_order_cache_group_v1
      transaction-order-statistics: pg_transaction_order_statistics_group_v1
      transaction-timeout-scheduler: pg_transaction_timeout_scheduler_group_v1
      transaction-order-timeout: pg_transaction_order_timeout_group_v1
    # 支付不改变商品库存，因此缓存组只订阅创建和取消；统计组订阅三种订单事实。
    subscriptions:
      cache-events: ORDER_CREATED || ORDER_CANCELLED
      statistics-events: ORDER_CREATED || ORDER_PAID || ORDER_CANCELLED
    consumer:
      ssl-enabled: false
      request-timeout: 3
      max-cached-message-count: 1024
      max-cache-message-size-in-bytes: 67108864
      consumption-thread-count: 20
      filter-expression-type: tag
      namespace: ""
      access-key: ""
      secret-key: ""

    order-timeout-millis: 1800000
    delay:
      # 两套超时链路统一使用该最小延迟；过期任务也不会把 0 秒传给 DELAY API。
      minimum-broker-delay-seconds: 1
    product-cache:
      # 最终 Redis Key 为 key-prefix + productId，例如 playground:product:1。
      key-prefix: "playground:product:"
      ttl-seconds: 300
    transaction-prepared-timeout-seconds: 120
    transaction-cleanup-batch-size: 50
    transaction-cleanup:
      fixed-delay-millis: 30000
      initial-delay-millis: 30000
    outbox:
      batch-size: 20
      fixed-delay-millis: 3000
      lock-timeout-seconds: 60
      max-publish-retries: 10
      retry:
        initial-delay-seconds: 5
        max-delay-seconds: 300
        max-exponent: 6

# XXL-JOB Executor 默认关闭；开启后 Admin 必须能访问 Executor 的 address/port。
xxl:
  job:
    admin:
      addresses: http://127.0.0.1:18083
      access-token: xxl-job-learning-token
      timeout: 3
    executor:
      enabled: false
      appname: spring-feature-collection-executor
      address: http://host.docker.internal:19999
      ip: ""
      port: 19999
      log-path: /tmp/xxl-job/jobhandler
      log-retention-days: 7
      excluded-package: org.springframework,spring
    learning:
      # 调度重试跨午夜时 logDateTime 可能变化；严格重跑仍应在任务参数中显式传 businessDate。
      business-zone: Asia/Shanghai
