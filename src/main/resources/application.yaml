spring:
  application:
    name: xiaoxingxing
  data:
    mongodb:
      auto-index-creation: true
      representation:
        big-decimal: decimal128
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
  # Flyway 只绑定到标记了 @FlywayDataSource 的 playgroundDataSource，避免迁移误用 business 库。
  # 启动会在 demo 库创建 flyway_migration schema 并执行待处理版本。
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/playground
    schemas:
      - flyway_migration
    default-schema: flyway_migration
    create-schemas: true
    table: flyway_schema_history
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

logging:
  level:
    root: INFO
    web: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(---){faint} %clr([%15.15thread]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %msg%n"

application:
  mybatis:
    mapper-locations:
      business: []
      playground:
        - "classpath*:mapper/**/*.xml"
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    pagination-db-type: POSTGRE_SQL
  redis:
    lock:
      wait-time: 3s
      lease-time: 10s
      simulated-work-duration: 1s
  cors:
    path-pattern: "/**"
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
  open-api:
    title: API 文档
    version: 1.0.0
    description: 项目接口文档
    group: playground
    display-name: playground

playground:
  elasticsearch:
    vector-dimensions: 8
    max-page-size: 50
    max-bulk-size: 100
    pit-keep-alive: 1m
    default-k: 5
    default-num-candidates: 50
    number-of-shards: 1
    number-of-replicas: 0

# Flowable 学习模块：BPMN 与 DMN 共用 playground PostgreSQL 数据源。
# Flowable 的自动配置默认按 @Primary 数据源（business）建表；
# FlowableDataSourceConfig 会在引擎创建阶段把两套引擎切换到 playgroundDataSource。
flowable:
  # 数据库结构由 Docker 的 30-flowable-learning-schema.sql 提供，启动时不执行 DDL；
  # BPMN/DMN 自动部署仍会把定义与资源写入 ACT_RE_/ACT_DMN_ 表。
  database-schema-update: false
  check-process-definitions: true
  history-level: audit
  db-history-used: true
  jpa-enabled: false
  rest-api-enabled: false
  # 学习环境不启用后台异步线程，避免应用启动后产生额外调度与数据库写入。
  async-executor-activate: false
  async-history-executor-activate: false
  process:
    enabled: true
    # 兼容 Flowable 8 的 process 专属开关，显式关闭异步历史执行器。
    async-history:
      enable: false
  dmn:
    enabled: true
    deploy-resources: true
    resource-location: classpath*:/flowable/dmn/
    resource-suffixes:
      - "**.dmn"
      - "**.dmn.xml"
      - "**.dmn11"
      - "**.dmn11.xml"
    history-enabled: true
  # 流程定义资源放在独立目录，避免与其他模块的 BPMN 文件混淆。
  process-definition-location-prefix: classpath*:/flowable/processes/
  process-definition-location-suffixes:
    - "**.bpmn20.xml"
    - "**.bpmn"
  # 仅学习 BPMN/DMN，不创建其他 Flowable 引擎的附加表。
  app:
    enabled: false
  cmmn:
    enabled: false
  # 同时关闭旧版 db-identity-used 开关，避免 Flowable 尝试初始化 IDM 表。
  db-identity-used: false
  idm:
    enabled: false
  eventregistry:
    enabled: false

xxl:
  job:
    admin:
      timeout: 3
    executor:
      appname: spring-feature-collection-executor
      ip: ""
      log-retention-days: 7
      excluded-package: org.springframework,spring
