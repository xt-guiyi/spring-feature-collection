# services：定义需要由 Compose 创建和管理的容器服务。
services:
  # postgres：PostgreSQL 关系型数据库服务。
  postgres:
    # image：使用的镜像及版本标签。
    image: postgres:18.4
    # container_name：固定容器名称，便于 docker 命令和日志查看。
    container_name: local-postgres
    # restart：容器异常退出时自动重启；手动停止后不自动拉起。
    restart: unless-stopped
    # environment：向容器注入环境变量；PostgreSQL 官方镜像用它完成首次初始化。
    environment:
      # 初始化数据库的管理员用户名。
      POSTGRES_USER: root
      # 初始化数据库管理员密码。
      POSTGRES_PASSWORD: 123456
      # 首次初始化时创建供 Playground 使用的数据库。
      POSTGRES_DB: demo
    ports:
      # 宿主机端口:容器端口；本机 5432 转发到容器 5432。
      - "5432:5432"
    # 把容器目录挂载到持久化卷，删除容器后数据仍保留。
    volumes:
      - postgres_data:/var/lib/postgresql
      # PostgreSQL 官方镜像只在数据目录为空时，按文件名字典序执行初始化脚本。
      # 10 创建业务学习表和示例数据，20 创建 XXL-JOB 执行器侧的业务状态表。
      - ./init/postgres/10-schema-demo.sql:/docker-entrypoint-initdb.d/10-schema-demo.sql:ro
      - ./init/postgres/20-xxl-job-learning-schema.sql:/docker-entrypoint-initdb.d/20-xxl-job-learning-schema.sql:ro


  # redis：Redis 内存数据库及缓存服务。
  redis:
    image: redis:8.8
    container_name: local-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # mongo：MongoDB 文档数据库服务。
  mongo:
    image: mongo:8
    container_name: local-mongo
    restart: unless-stopped
    environment:
      # MongoDB 首次初始化时创建的 root 用户名。
      MONGO_INITDB_ROOT_USERNAME: root
      # MongoDB 首次初始化时创建的 root 用户密码。
      MONGO_INITDB_ROOT_PASSWORD: 123456
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Elasticsearch API 
  # elasticsearch：全文检索和向量检索服务。
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    container_name: local-elasticsearch
    restart: unless-stopped
    environment:
      # 单节点模式，不加入 Elasticsearch 集群。
      discovery.type: single-node
      # 关闭 Elasticsearch 认证和 TLS；仅适合本机学习。
      xpack.security.enabled: "false"
      # 设置 JVM 堆内存的最小值和最大值，避免无限占用内存。
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      # Compose 用它判断服务是否真正可用，而不只是进程已启动。
      # test：执行健康检查的命令；命令退出码为 0 才表示健康。
      test:
        - CMD-SHELL
        - curl --silent --fail http://localhost:9200/_cluster/health >/dev/null || exit 1
      # interval：两次健康检查之间的间隔。
      interval: 10s
      # timeout：单次检查允许执行的最长时间。
      timeout: 5s
      # retries：连续失败多少次后判定为不健康。
      retries: 30
      # start_period：服务启动后的宽限期，期间失败不计入重试次数。
      start_period: 30s
    networks:
      - elasticsearch-network

  # kibana：Elasticsearch 的可视化和 Dev Tools 管理界面。
  # 只提供本地 Dev Tools 和索引观察界面，不参与 Spring 应用的查询链路。
  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.5
    container_name: local-kibana
    restart: unless-stopped
    environment:
      # Kibana 容器内通过 Compose 服务名访问 Elasticsearch。
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      # 与 Elasticsearch 保持一致，关闭 Kibana 安全认证。
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        # condition：只有依赖服务达到 healthy 状态后才启动 Kibana。
        condition: service_healthy
    networks:
      - elasticsearch-network

  # xxl-job-mysql：XXL-JOB Admin 专用的 MySQL 数据库。
  xxl-job-mysql:
    image: mysql:8.4
    container_name: local-xxl-job-mysql
    restart: unless-stopped
    environment:
      # 设置容器和 MySQL 的时区。
      TZ: Asia/Shanghai
      # 首次初始化时创建 XXL-JOB Admin 使用的数据库。
      MYSQL_DATABASE: xxl_job
      # 首次初始化时创建的普通数据库用户。
      MYSQL_USER: xxl_job
      # 本地学习默认 123456；需要更安全的值时，通过同名宿主机环境变量覆盖。
      MYSQL_PASSWORD: ${XXL_JOB_MYSQL_PASSWORD:-123456}
      MYSQL_ROOT_PASSWORD: ${XXL_JOB_MYSQL_ROOT_PASSWORD:-123456}
    # 覆盖镜像默认启动参数，设置 MySQL 字符集和排序规则。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # 只在 Docker 网络内部声明端口，不发布到宿主机。
    expose:
      # 只向 Compose 网络暴露，不占用宿主机 3306；Admin 通过服务名访问。
      - "3306"
    volumes:
      - xxl_job_mysql_data:/var/lib/mysql
      # MySQL 官方镜像只在数据目录为空时按文件名字典序执行初始化脚本。
      # 10 创建 XXL-JOB 官方表，20 幂等写入本项目的停止状态学习任务。
      - ./init/xxl-job/3.4.2/10-tables_xxl_job.sql:/docker-entrypoint-initdb.d/10-tables_xxl_job.sql:ro
      - ./init/xxl-job/3.4.2/20-learning-jobs.sql:/docker-entrypoint-initdb.d/20-learning-jobs.sql:ro
    # 必须确认官方表和 schedule_lock 种子数据已创建，Admin 才能连接。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1
          --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
          --skip-column-names --silent
          --execute="SELECT COUNT(*) FROM xxl_job_lock WHERE lock_name = 'schedule_lock';"
          | grep -qx '1'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - xxl-job-network

  # xxl-job-admin：XXL-JOB 的任务调度管理端和管理界面。
  # 只负责任务编排与触发，实际业务逻辑仍由 Spring 项目中的执行器 Handler 执行。
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.2
    container_name: local-xxl-job-admin
    restart: unless-stopped
    environment:
      # 设置 Admin 容器时区。
      TZ: Asia/Shanghai
      # Admin 日志在容器内的保存目录。
      LOG_HOME: /data/applogs
      # JVM 的初始堆和最大堆内存。
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
      # 传给 Admin Spring Boot 的启动参数；> - 会把多行折叠为空格分隔的字符串。
      # 其中包含数据库连接、容器端口、上下文路径和访问令牌配置。
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://xxl-job-mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=xxl_job
        --spring.datasource.password=${XXL_JOB_MYSQL_PASSWORD:-123456}
        --server.port=8080
        --server.servlet.context-path=/
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:-xxl-job-learning-token}
    ports:
      - "18083:8080"
    volumes:
      - xxl_job_admin_logs:/data/applogs
    # 给容器增加宿主机地址映射。
    extra_hosts:
      # Admin 在容器内，需要通过该地址回调运行在宿主机上的 Spring 执行器。
      - "host.docker.internal:host-gateway"
    depends_on:
      xxl-job-mysql:
        # 等 MySQL 健康后再启动 Admin，避免首次初始化期间连接失败。
        condition: service_healthy
    networks:
      - xxl-job-network

  # rocketmq-nameserver：RocketMQ 的路由注册中心。
  # 只保存“Topic 在哪些 Broker 上”的路由信息，不负责保存业务消息。
  # Java 5.x gRPC 客户端也不会直接连这个 9876 端口，而是通过下面的 Proxy 接入。
  rocketmq-nameserver:
    image: apache/rocketmq:5.5.0
    container_name: local-rocketmq-nameserver
    restart: unless-stopped
    # 启动 NameServer 进程，覆盖镜像默认命令。
    command: sh mqnamesrv
    environment:
      # 本地学习环境降低 JVM 初始内存；生产环境应按流量、堆外内存和 PageCache 重新评估。
      JAVA_OPT_EXT: -Xms128m -Xmx128m -Xmn64m
    ports:
      - "9876:9876"
    volumes:
      - rocketmq_nameserver_logs:/home/rocketmq/logs
    networks:
      - rocketmq-network

  # rocketmq-broker：RocketMQ 消息存储、消费进度和投递处理节点。
  # 才是真正持久化消息、维护 CommitLog/ConsumeQueue、提供重试与死信能力的组件。
  # 单 Broker 只适合学习：容器或宿主机故障时没有副本可以接管。
  rocketmq-broker:
    image: apache/rocketmq:5.5.0
    container_name: local-rocketmq-broker
    restart: unless-stopped
    # 启动 Broker，并指定 NameServer 地址。
    command: sh mqbroker -n rocketmq-nameserver:9876
    environment:
      # Broker 注册和发现 NameServer 所使用的地址。
      NAMESRV_ADDR: rocketmq-nameserver:9876
      # Broker JVM 的初始堆、最大堆和新生代内存。
      JAVA_OPT_EXT: -Xms256m -Xmx256m -Xmn128m
    ports:
      # 这些是 Broker Remoting/HA 端口；本项目的 Java 代码走 Proxy 的 18081。
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - rocketmq_broker_store:/home/rocketmq/store
      - rocketmq_broker_logs:/home/rocketmq/logs
    depends_on:
      - rocketmq-nameserver
    networks:
      - rocketmq-network

  # rocketmq-proxy：RocketMQ 5.x 客户端接入层，负责转发到 Broker。
  # 把 RocketMQ 5.x gRPC 协议转换为 Broker 能处理的请求。
  # 宿主机 18081 -> 容器 8081，正好对应 application.yaml 的 ROCKETMQ_ENDPOINTS 默认值。
  rocketmq-proxy:
    image: apache/rocketmq:5.5.0
    container_name: local-rocketmq-proxy
    restart: unless-stopped
    # 启动 Proxy，指定 NameServer 和 Proxy 配置文件路径。
    command: sh mqproxy -n rocketmq-nameserver:9876 -pc /tmp/rmq-proxy-learning.json
    # 把 Compose 配置内容挂载为容器内的配置文件。
    configs:
      # Docker 端口映射下，Proxy 必须把客户端请求中的宿主机端口 18081 原样返回。
      # 否则默认行为会把路由端口改成容器内的 8081，宿主机客户端后续连接会被拒绝。
      - source: rocketmq-proxy-config
        # target：配置文件在 Proxy 容器内的实际路径。
        target: /tmp/rmq-proxy-learning.json
    environment:
      # Proxy 注册和发现 NameServer 所使用的地址。
      NAMESRV_ADDR: rocketmq-nameserver:9876
      # Proxy JVM 的初始堆、最大堆和新生代内存。
      JAVA_OPT_EXT: -Xms256m -Xmx256m -Xmn128m
    ports:
      - "18080:8080"
      - "18081:8081"
    volumes:
      - rocketmq_proxy_logs:/home/rocketmq/logs
    depends_on:
      - rocketmq-nameserver
      - rocketmq-broker
    networks:
      - rocketmq-network

  # rocketmq-dashboard：RocketMQ 的监控和管理界面。
  # 只用于观察与管理，不参与消息投递链路。
  # 启动后访问 http://localhost:18082 查看 Topic、ConsumerGroup、重试和死信消息。
  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: local-rocketmq-dashboard
    restart: unless-stopped
    environment:
      # Dashboard JVM 的内存参数及 NameServer 地址。
      JAVA_OPTS: >-
        -Xms128m -Xmx256m
        -Drocketmq.namesrv.addr=rocketmq-nameserver:9876
    ports:
      - "18082:8082"
    depends_on:
      - rocketmq-nameserver
      - rocketmq-broker
    networks:
      - rocketmq-network
  
# configs：定义可挂载到容器中的配置文件内容。
configs:
  rocketmq-proxy-config:
    # content：直接在 Compose 文件中生成配置文件，而不是读取宿主机文件。
    content: |
      {
        "rocketMQClusterName": "DefaultCluster",
        "enableTopicMessageTypeCheck": true,
        "useEndpointPortFromRequest": true
      }

# volumes：声明 Compose 管理的命名卷；具体挂载位置由各服务的 volumes 字段决定。
volumes:
  # 以下名称是 Docker 管理的卷名；空定义表示使用 Compose 默认配置。
  postgres_data:
  redis_data:
  mongo_data:
  elasticsearch_data:
  xxl_job_mysql_data:
  xxl_job_admin_logs:
  rocketmq_nameserver_logs:
  rocketmq_broker_store:
  rocketmq_broker_logs:
  rocketmq_proxy_logs:

# networks：声明服务之间通信使用的 Docker 网络。
networks:
  # Elasticsearch 与 Kibana 通过服务名互相访问。
  elasticsearch-network:
    # name：实际创建的 Docker 网络名称。
    name: local-elasticsearch-network

  # XXL-JOB 组件只在这个网络中通过服务名互相发现；MySQL 不对宿主机发布端口。
  xxl-job-network:
    name: local-xxl-job-network

  # RocketMQ 组件使用独立网络，通过服务名互相发现，不污染已有数据库服务的连接方式。
  rocketmq-network:
    name: local-rocketmq-network
