# Nacos dataId: user-service-dev.yaml
# group: SPRING_FEATURE_COLLECTION
server:
  # 端口 0 表示由操作系统为每个实例自动分配空闲端口，支持同一模块启动多个实例。
  port: 0

shared:
  infrastructure:
    # 用户服务当前只使用 PostgreSQL，不启用这些公共中间件配置。
    redis:
      enabled: false
    elasticsearch:
      enabled: false
    mongodb:
      enabled: false
    rocketmq:
      enabled: false

spring:
  cloud:
    nacos:
      discovery:
        # 本机启动的服务注册为本机可达地址，避免被虚拟网卡地址 192.168.110.55 替代。
        ip: ${NACOS_DISCOVERY_IP:192.168.2.216}
  datasource:
    url: jdbc:postgresql://${USER_DB_HOST:104.155.229.164}:5432/user_db?options=-c%20TimeZone%3DAsia%2FShanghai
    username: root
    password: 123456
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
